[build-system]
requires = ["setuptools>=77.0", "wheel>=0.41.0"]
build-backend = "setuptools.build_meta"

[project]
name = "indus"
version = "0.1.0"
description = "Reproducible QLoRA fine-tuning and evaluation for engineering document summarization"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Indus"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
train = [
    "torch>=2.2,<3", "transformers>=4.40,<5", "peft>=0.10,<1",
    "bitsandbytes>=0.43,<1; sys_platform == 'linux'",
    "datasets>=2.16,<4", "bert-score>=0.3.13,<0.4", "rouge-score>=0.1.2,<0.2",
    "sacrebleu>=2.3,<3", "mlflow>=2.12,<3", "hydra-core>=1.3,<1.4",
    "accelerate>=0.28,<2", "sentencepiece>=0.1.99,<1", "protobuf>=4.25,<7",
    "matplotlib>=3.8,<4", "seaborn>=0.13,<1",
    "numpy>=1.26,<3", "psutil>=5.9,<8", "tqdm>=4.66,<5",
]
dev = [
    "pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1", "black>=24,<27",
    "build>=1,<2", "hydra-core>=1.3,<1.4", "numpy>=1.26,<3",
    "psutil>=5.9,<8", "matplotlib>=3.8,<4", "seaborn>=0.13,<1",
    "rouge-score>=0.1.2,<0.2", "sacrebleu>=2.3,<3", "mlflow-skinny>=2.12,<4",
]

[project.scripts]
indus = "indus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
]
ignore = ["E501", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["indus"]

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring GPU",
]

